
<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f2f2f2;
        }

        .blog {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
        }

        @media(max-width: 576px) {
            h1 {
                font-size: 24px;
            }
            .blog {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">My Blog</a>
    </div>
</nav>

<div class="container text-center mt-4">
    <h1>Welcome to My Blog</h1>
    <p>Explore interesting articles and stories.</p>
</div>

<div class="container">
    <div class="row">

        <div class="col-md-4">
            <div class="blog">
                <h3>Technology</h3>
                <p>Latest technology updates.</p>
                <button class="btn btn-primary">Read More</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="blog">
                <h3>Travel</h3>
                <p>Explore beautiful places.</p>
                <button class="btn btn-primary">Read More</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="blog">
                <h3>Education</h3>
                <p>Learn something new every day.</p>
                <button class="btn btn-primary">Read More</button>
            </div>
        </div>

    </div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-4">
    My Blog Website © 2026
</footer>

</body>
</html>

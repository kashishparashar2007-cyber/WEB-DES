
<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>
    <style>
        body {
            text-align: center;
            background: #f2f2f2;
            font-family: Arial;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 30px auto;
            width: 300px;
            border-radius: 10px;
        }

        button {
            margin: 5px;
            padding: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>My Notes App</h2>

    <input type="text" id="note" placeholder="Enter note">
    <button onclick="addNote()">Add</button>

    <div id="notes"></div>
</div>

<script>
    function addNote() {
        let input = document.getElementById("note");
        let value = input.value;

        if (value == "") return;

        let div = document.createElement("p");
        div.innerHTML = value;

        let edit = document.createElement("button");
        edit.innerHTML = "Edit";

        edit.onclick = function() {
            input.value = div.firstChild.textContent;
            div.remove();
        };

        let del = document.createElement("button");
        del.innerHTML = "Delete";

        del.onclick = function() {
            div.remove();
        };

        div.append(edit, del);
        document.getElementById("notes").append(div);

        input.value = "";
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Weather App</title>
<style>
body{
    font-family:Arial;text-align:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:50px;
}
.box{
    background:white;padding:30px;margin:auto;
    width:350px;border-radius:15px;
}
input,button{
    padding:12px;margin:5px;border-radius:6px;
}
button{
    background:#007bff;color:white;border:0;
}
#weather{margin-top:20px}
</style>
</head>

<body>

<div class="box">
<h1>🌤️ Weather App</h1>

<input id="city" placeholder="Enter city name">
<button onclick="getWeather()">Search</button>

<div id="weather"></div>
</div>

<script>
async function getWeather(){
    let city=document.getElementById("city").value;
    let result=document.getElementById("weather");

    if(city==""){
        result.innerHTML="Enter a city name";
        return;
    }

    try{
        let geo=await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`
        );
        let data=await geo.json();

        if(!data.results){
            result.innerHTML="City not found!";
            return;
        }

        let {latitude,longitude,name,country}=data.results[0];

        let res=await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`
        );
        let weather=await res.json();

        result.innerHTML=`
        <h2>${name}, ${country}</h2>
        <h3>🌡️ ${weather.current.temperature_2m}°C</h3>
        <p>💧 Humidity: ${weather.current.relative_humidity_2m}%</p>
        <p>💨 Wind: ${weather.current.wind_speed_10m} km/h</p>`;
    }
    catch(error){
        result.innerHTML="Unable to fetch weather data.";
    }
}
</script>

</body>
</html>

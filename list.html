<!DOCTYPE html>
<html>
<head>
<title>To-Do List</title>

<style>
body{text-align:center;font-family:Arial;background:#f4f4f4}
.container{width:350px;margin:50px auto;background:white;padding:20px}
input{padding:10px;width:65%}
button{padding:10px;background:#00adb5;color:white;border:0}
li{list-style:none;padding:10px;text-align:left}
.done{text-decoration:line-through;color:gray}
.delete{float:right;background:red;padding:5px}
</style>
</head>

<body>

<div class="container">
<h2>My To-Do List</h2>

<input id="task" placeholder="Enter a task">
<button onclick="addTask()">Add</button>

<ul id="list"></ul>
</div>

<script>
function addTask(){
    let input=document.getElementById("task");
    if(input.value=="") return;

    let li=document.createElement("li");
    li.innerHTML=input.value+
    ' <button class="delete" onclick="this.parentElement.remove()">Delete</button>';

    li.onclick=function(e){
        if(e.target.tagName!="BUTTON")
            li.classList.toggle("done");
    };

    document.getElementById("list").appendChild(li);
    input.value="";
}
</script>

</body>
</html>
